[project]
name = "p2p-pursuit"
version = "1.0.0"
description = "Distributed Cops-and-Robbers over a P2P network - autonomous police/thief peers (FastMCP, commit-reveal, scent + Bayesian belief)"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
]

[project.optional-dependencies]
gmail = ["google-api-python-client>=2", "google-auth-oauthlib>=1"]
llm = ["anthropic>=0.40", "openai>=1.40"]
analysis = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
p2p-pursuit = "p2p_pursuit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_pursuit"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/p2p_pursuit"]
omit = [
    "*/gui/*",
    "*/infra/mcp_server.py",
    "*/infra/mcp_client.py",
    "*/cli.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 85
