# Two-repo submission split (book §9.4, PLAN ADR-2) - consumed by
# scripts/sync_repos.py. repos_root is relative to the workspace root.
[sync]
owner = "yosefshanaa"
repos_root = ".."
# The development repository the two role repos are published FROM. Named here
# rather than in the script so the banner URL stays config-driven like the rest.
workspace = "final_Project"

[sync.roles]
police = "p2p-police-agent"
thief = "p2p-thief-agent"
